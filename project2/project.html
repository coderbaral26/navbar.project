<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="project.css">
</head>

<body>

    <div class="form-container">

        <div class="heading">
            REGISTRATION FORM
        </div>

        <form>

            <div class="name-row">
                <div class="field">
                    <label>First Name</label>
                    <input type="text">
                </div>

                <div class="field">
                    <label>Last Name</label>
                    <input type="text">
                </div>
            </div>

            <div class="field">
                <label>Email Address</label>
                <input type="email">
            </div>

            <div class="field">
                <label>City</label>
                <input type="text">
            </div>

            <div class="field">
                <label>Country</label>
                <input type="text">
            </div>

            <label>Gender</label>

            <div class="gender">
                <label>
                    <input type="radio" name="gender" checked>
                    <span>Male</span>
                </label>

                <label>
                    <input type="radio" name="gender">
                    <span>Female</span>
                </label>
            </div>

            <button type="submit">REGISTER NOW</button>

        </form>

    </div>

</body>
</html>
